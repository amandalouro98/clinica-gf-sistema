events {
    worker_connections 1024;
}

http {
    upstream streamlit {
        server app:8501;
    }

    # ---------- HTTP (porta 80): desafio do certbot + redireciona pra HTTPS ----------
    server {
        listen 80;
        server_name gabifrancosaude.com.br www.gabifrancosaude.com.br sistema.gabifrancosaude.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS: SISTEMA (Streamlit) em sistema.gabifrancosaude.com.br ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name sistema.gabifrancosaude.com.br;

        ssl_certificate /etc/letsencrypt/live/gabifrancosaude.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gabifrancosaude.com.br/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Proxy para o Streamlit
        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ---------- HTTPS: DOMINIO PRINCIPAL vazio (gabifrancosaude.com.br + www) ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name gabifrancosaude.com.br www.gabifrancosaude.com.br;

        ssl_certificate /etc/letsencrypt/live/gabifrancosaude.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gabifrancosaude.com.br/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            default_type text/html;
            return 200 "<!doctype html><html lang=\"pt-br\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Gabi Franco Saude</title><style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;background:#f7efe9;color:#b87575}h1{font-weight:600}</style></head><body><h1>Em breve</h1></body></html>";
        }
    }
}
